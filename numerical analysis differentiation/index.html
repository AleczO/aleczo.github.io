    <h3> Forward Difference Formula </h3>

    <button type="button" class="collapsible"><span class="material-symbols-outlined"> keyboard_arrow_down </span> </button>
    <div class="content">


    From Taylor expansion 

    $$ f(x + h) = f(x) + hf'(x) + \frac{h^2}{2} f''(x) + \frac{1}{2} $$


    </div>
    <br>

    Formula
    $$ f'(x) \approx \frac{f(x + h) - f(x)}{h} $$
